<div id="writter-discovery">

    #writter-discovery button,#writter-discovery a{cursor:pointer}

    #writter-discovery .nav strong{font-weight:500;color:var(--green)}

    #writter-discovery h1{font-size:27px;font-weight:500;margin:0 0 5px}
    #writter-discovery h2{font-size:21px;font-weight:500;margin:0 0 12px}
    #writter-discovery h3{font-size:17px;font-weight:500;margin:8px 0}
    #writter-discovery p{margin:8px 0}
    #writter-discovery .sub{color:var(--muted);font-size:13px}

    #writter-discovery .tag{background:var(--soft);color:var(--green);padding:3px 8px;border-radius:5px}
    #writter-discovery #wd-cards .actions{margin-top:10px}
    #writter-discovery #wd-cards h3{margin:5px 0}
    #writter-discovery #wd-cards p{display:none}
    #writter-discovery .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
    #writter-discovery a{color:var(--green);text-underline-offset:3px;overflow-wrap:anywhere}
    #writter-discovery .aside{background:var(--soft);border-radius:13px;padding:15px}
    #writter-discovery .picked{margin:0;padding:0;list-style:none}
    #writter-discovery .picked li{padding:12px 0;border-bottom:1px solid #cfdbcc}
    #writter-discovery .picked button{margin-top:7px;padding:4px 9px;background:transparent}
    #writter-discovery .aside .main{margin-top:16px;width:100%}
    #writter-discovery .back{margin-bottom:18px}
    #writter-discovery .reading-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:26px;margin-top:25px;align-items:start}
    #writter-discovery .writing-panel{background:var(--soft);border-radius:13px;padding:20px}
    #writter-discovery .writing-panel textarea{min-height:270px;margin-top:12px}

      const skeletons={
        event:{label:'事件介绍',hint:'把事情与有意思的变化讲清楚，不要求表态。',options:{overview:{name:'先讲全貌，再拆变化',rows:[['这件事是什么','交代主体、发生的事与已知边界'],['最值得关注的变化','选择一个有意思的点，用资料讲具体'],['放进背景里看','补必要背景或与过去的差别'],['读者需要记住什么','收束信息，不夸大意义']]},points:{name:'三个看点，再作收束',rows:[['用一句话进入事件','让读者知道在讲什么'],['第一个看点','讲清一个具体变化'],['第二个看点','补充不同角度，避免重复'],['第三个看点','说明影响或仍待观察之处'],['把看点串起来','简短收束，不强行输出立场']]}}},
        explain:{label:'解释分析',hint:'围绕一个问题逐步解释，判断与事实分别表达。',options:{question:{name:'问题 → 解释 → 含义',rows:[['读者可能困惑什么','提出一个明确的问题'],['先解释基本概念','给非专业读者必要背景'],['事情为什么这样','用有依据的材料说明机制'],['这意味着什么','区分已知影响与自己的推测']]},compare:{name:'比较差异，再作判断',rows:[['为什么值得比较','确定比较问题和范围'],['相同尺度下看差异','明确比较维度，避免只堆参数'],['差异从哪里来','用资料解释，未知处明确保留'],['怎样理解这些差异','给出有边界的判断']]}}},
        method:{label:'方法分享',hint:'表达你认可的建议，并说明理由、例子和适用边界。',options:{problem:{name:'困扰 → 方法 → 验证',rows:[['从真实困扰开始','说明读者遇到的问题'],['我建议怎么做','写出需要你认可的核心建议'],['分步骤展开','每一步给动作、理由与例子'],['如何判断有没有帮助','给出验证方式与不适用情况']]},thesis:{name:'总观点 → 分论点 → 总结',rows:[['这篇文章主张什么','先确定你认可的总观点'],['第一个理由','分论点加依据或例子'],['第二个理由','提供不同层面的理由'],['回到读者行动','收束观点与可执行的建议']]}}}
      };
      function workbench(id){
        const d=data.find(x=>x.id===id);
        if(!drafts.has(id))drafts.set(id,{type:'event',bone:'overview',versions:{},confirmed:false});
        const st=drafts.get(id);const cfg=skeletons[st.type];const key=st.type+':'+st.bone;
        if(!st.versions[key])st.versions[key]=cfg.options[st.bone].rows.map(([title,purpose])=>({title,purpose,points:''}));
        const rows=st.versions[key];screen('workbench');
        el('wd-workbench').innerHTML=`<button class="back" id="wd-work-back" type="button">← 返回已选题材</button><div class="meta">写作工作台 · 大纲原型</div><h1>${esc(d.title)}</h1><div class="outline-tools"><label>文章类型<select id="wd-type">${Object.entries(skeletons).map(([v,x])=>`<option value="${v}" ${v===st.type?'selected':''}>${x.label}</option>`).join('')}</select></label><label>文章骨架<select id="wd-bone">${Object.entries(cfg.options).map(([v,x])=>`<option value="${v}" ${v===st.bone?'selected':''}>${x.name}</option>`).join('')}</select></label></div><p class="sub">${cfg.hint} 切换骨架会保留各自的编辑记录。</p><div class="outline-grid"><section><h2>安排这篇文章怎么讲</h2><div id="wd-rows">${rows.map((r,i)=>`<article class="outline-row"><div class="meta">第 ${i+1} 部分 · ${esc(r.purpose)}</div><label class="sub" for="wd-title-${i}">段落标题</label><input id="wd-title-${i}" data-row="${i}" data-field="title" value="${esc(r.title)}"><label class="sub" for="wd-points-${i}">具体要点${st.type==='method'?'与观点':''}</label><textarea id="wd-points-${i}" data-row="${i}" data-field="points" placeholder="写这部分具体要讲的内容；需要资料支撑的地方可注明资料编号。">${esc(r.points)}</textarea><div class="actions"><button type="button" data-move="${i}" data-direction="-1" ${i===0?'disabled':''}>上移</button><button type="button" data-move="${i}" data-direction="1" ${i===rows.length-1?'disabled':''}>下移</button><button type="button" data-remove="${i}">删除</button></div></article>`).join('')}</div><div class="actions"><button type="button" id="wd-add-row">添加一部分</button><button type="button" class="main" id="wd-confirm-outline">${st.confirmed?'更新写作要求':'确认大纲，整理写作要求'}</button></div><p class="sub" id="wd-outline-state" aria-live="polite">${st.confirmed?'写作要求已整理；修改后可重新整理。':'示例骨架用于讨论，尚未结合你的文章样稿确定。'}</p><div id="wd-export" hidden><label for="wd-brief">可交给外部 AI 的写作要求</label><textarea class="export-brief" id="wd-brief" readonly></textarea><div class="actions"><button type="button" id="wd-copy">复制写作要求</button></div><p class="sub" id="wd-copy-state" aria-live="polite"></p></div></section><aside class="aside"><h3>选题想法</h3><p>${esc(notes.get(id)||'尚未指定角度，先把这件事讲清楚。')}</p><h3>资料入口</h3>${d.reports.map((r,i)=>`<p class="sub">资料 ${i+1} · ${esc(r.name)}<br><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ↗</a></p>`).join('')}<p class="sub">此处只有结构与手动要点。未读取全文、未调用 AI，也未生成事实或替你指定观点。</p></aside></div>`;
        const changed=()=>{st.confirmed=false;el('wd-export').hidden=true;el('wd-outline-state').textContent='大纲已修改，扩写前重新整理写作要求。'};
        el('wd-work-back').addEventListener('click',handoff);
        el('wd-type').addEventListener('change',e=>{st.type=e.target.value;st.bone=Object.keys(skeletons[st.type].options)[0];st.confirmed=false;workbench(id)});
        el('wd-bone').addEventListener('change',e=>{st.bone=e.target.value;st.confirmed=false;workbench(id)});
        el('wd-rows').addEventListener('input',e=>{if(e.target.dataset.field){rows[Number(e.target.dataset.row)][e.target.dataset.field]=e.target.value;changed()}});
        el('wd-rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.move!==undefined){const i=Number(b.dataset.move),j=i+Number(b.dataset.direction);[rows[i],rows[j]]=[rows[j],rows[i]]}if(b.dataset.remove!==undefined)rows.splice(Number(b.dataset.remove),1);st.confirmed=false;workbench(id)});
        el('wd-add-row').addEventListener('click',()=>{rows.push({title:'补充一部分',purpose:'补充你需要的内容',points:''});st.confirmed=false;workbench(id)});
        el('wd-confirm-outline').addEventListener('click',()=>{
          if(!rows.length){el('wd-outline-state').textContent='先添加至少一个部分，再整理写作要求。';return}
          const empty=rows.some(r=>!r.points.trim());
          const brief=['请据以下资料和大纲扩写公众号文章。','题材：'+d.title,'文章类型：'+cfg.label,'骨架：'+cfg.options[st.bone].name,'我的想法：'+(notes.get(id)||'未指定个人立场，不要代我编造观点。'),'资料入口（链接尚未读取；若无法访问，先索要必要原文，不要猜测）：',...d.reports.map((r,i)=>`资料 ${i+1}：${r.url}`),'大纲：',...rows.map((r,i)=>`${i+1}. ${r.title}\n段落作用：${r.purpose}\n要点：${r.points||'待补充；先提出建议供我确认，不直接编造成稿。'}`),'要求：区分事实、推测与个人意见；不用摘要冒充全文依据；不要夸大成果；避免套话和强行升华；段落之间有清楚的推进。',st.type==='method'?'方法与论点需要我的确认，给出动作、例子与适用边界。':'围绕事情或问题讲清楚，不强制添加硬观点。'].join('\n\n');
          el('wd-brief').value=brief;el('wd-export').hidden=false;st.confirmed=true;el('wd-outline-state').textContent=empty?'写作要求已整理；仍有空要点，已标注待补充。':'写作要求已整理，可继续修改或交给外部 AI。';
        });
        el('wd-copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(el('wd-brief').value);el('wd-copy-state').textContent='已复制'}catch{el('wd-brief').focus();el('wd-brief').select();el('wd-copy-state').textContent='请复制上方已选中的文字。'}});
      }
      root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page+=b.dataset.page==='next'?1:-1;render();}if(b.dataset.pick)pick(b.dataset.pick);if(b.dataset.detail)detail(b.dataset.detail);if(b.dataset.write)workbench(b.dataset.write);if(b.hasAttribute('data-back')){screen('list');render()}});
      el('wd-hot').addEventListener('click',()=>{view='hot';page=1;render()});el('wd-more').addEventListener('click',()=>{view='more';page=1;render()});el('wd-start').addEventListener('click',handoff);render();
    })();
  </script>
</div>
